[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-kb-staleness-pruner"
version = "0.1.0"
description = "Exponential time-decay and contradiction pruner purging superseded facts from agent long-term knowledge bases"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
temporal-kb-staleness-pruner = "temporal_kb_staleness_pruner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["temporal_kb_staleness_pruner*"]
